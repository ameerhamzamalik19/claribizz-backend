<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claribizz Admin {% block title %}{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f4f0;
            color: #1a1a1a;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: 220px;
            height: 100vh;
            background: #1c2b1e;
            padding: 32px 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            padding: 0 24px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            letter-spacing: -0.5px;
        }

        .sidebar-logo span {
            color: #c9a84c;
        }

        .sidebar-nav {
            padding: 24px 0;
            flex: 1;
        }

        .nav-item {
            display: block;
            padding: 10px 24px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            color: #fff;
            background: rgba(255,255,255,0.06);
            border-left-color: #c9a84c;
        }

        .sidebar-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .logout-btn {
            display: block;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.15s;
        }

        .logout-btn:hover { color: #fff; }

        /* Main content */
        .main {
            margin-left: 220px;
            padding: 40px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }

        /* Cards */
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e8e6e0;
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e8e6e0;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: -1px;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.15s;
        }

        .btn-primary {
            background: #1c2b1e;
            color: #fff;
        }

        .btn-primary:hover { background: #2a3d2d; }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover { background: #fecaca; }

        .btn-secondary {
            background: #f0ede6;
            color: #1a1a1a;
        }

        .btn-secondary:hover { background: #e5e1d8; }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #1a1a1a;
            background: #fafafa;
            transition: border-color 0.15s;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: #1c2b1e;
            background: #fff;
        }

        .form-textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Table */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 10px 14px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #888;
            border-bottom: 1px solid #e8e6e0;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #f0ede6;
            vertical-align: top;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafaf8; }

        /* Alert */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-green {
            background: #dcfce7;
            color: #16a34a;
        }

        .badge-yellow {
            background: #fef9c3;
            color: #ca8a04;
        }

        /* Two column layout */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            align-items: start;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">Clari<span>bizz</span></div>
    <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="nav-item {% if request.url.path == '/admin/dashboard' %}active{% endif %}">
            Dashboard
        </a>
        <a href="/admin/clients" class="nav-item {% if '/admin/clients' in request.url.path %}active{% endif %}">
            Clients
        </a>
        <a href="/admin/conversations" class="nav-item {% if '/admin/conversations' in request.url.path %}active{% endif %}">
            Conversations
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="/admin/logout" class="logout-btn">← Log out</a>
    </div>
</div>

<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
