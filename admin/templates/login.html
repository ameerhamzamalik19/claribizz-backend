<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claribizz Admin — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: #fff;
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #e8e6e0;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #1c2b1e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo span { color: #c9a84c; }

        .tagline {
            font-size: 14px;
            color: #888;
            margin-bottom: 36px;
        }

        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fafafa;
            transition: border-color 0.15s;
        }

        .form-input:focus {
            outline: none;
            border-color: #1c2b1e;
            background: #fff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1c2b1e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            transition: background 0.15s;
        }

        .btn-login:hover { background: #2a3d2d; }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">Clari<span>bizz</span></div>
        <div class="tagline">Admin Panel — sign in to continue</div>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input class="form-input" type="text" name="username" autofocus required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input class="form-input" type="password" name="password" required>
            </div>
            <button class="btn-login" type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
